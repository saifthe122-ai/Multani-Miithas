name: Final launch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "final-launch-hardening-*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/multani_mithas_ci
      ADMIN_PASSWORD: ci-only-placeholder-password
      ADMIN_SESSION_SECRET: ci-only-placeholder-session-secret-32chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
